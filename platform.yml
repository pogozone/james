manifestVersion: "1"

app:
  name: james
  displayName: James
  version: "0.1.0"

web:
  local:
    host: james.emaz.local
    basePath: /
    apiBaseUrl: /james-todos/api/

  production:
    host: www.christian-woldt.de
    basePath: /james
    apiBaseUrl: /james/james-todos/api/

docker:
  dockerfile: Dockerfile
  context: .

runtime:
  port: 3003
  healthcheck: /james-todos/api/health

database:
  type: mongodb
  database: james
  urlEnvironmentVariable: MONGODB_URI